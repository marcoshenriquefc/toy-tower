<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toy Tower — Modo Corrida (MVP)</title>
    <style>
      .tt-boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #4f7de0 0%, #6ea1f4 55%, #93c5fd 100%);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        color: #ffffff;
        user-select: none;
        z-index: 9999;
      }
      .tt-boot-blocks {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
      }
      .tt-boot-block {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        border: 3px solid #1e293b;
        box-shadow: 0 4px 0 #1e293b;
        animation: ttBootBounce 0.9s infinite ease-in-out;
      }
      .tt-boot-block:nth-child(1) { background: #ef4444; animation-delay: 0s; }
      .tt-boot-block:nth-child(2) { background: #facc15; animation-delay: 0.15s; }
      .tt-boot-block:nth-child(3) { background: #22c55e; animation-delay: 0.3s; }
      .tt-boot-block:nth-child(4) { background: #3b82f6; animation-delay: 0.45s; }
      .tt-boot-title {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-shadow: 0 3px 0 #1e293b;
      }
      @keyframes ttBootBounce {
        0%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-12px); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="tt-boot-splash">
        <div class="tt-boot-blocks">
          <div class="tt-boot-block"></div>
          <div class="tt-boot-block"></div>
          <div class="tt-boot-block"></div>
          <div class="tt-boot-block"></div>
        </div>
        <div class="tt-boot-title">Carregando Toy Tower...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
